name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: ['**']
    push:
        branches: [next]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-pr:
        name: Validate PR Title
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Formatting, lint rules and the TS 7 type check of `.ts`/`.tsx` in one pass, then what that
    # pass cannot see: `vue-tsc` for SFCs and Storybook's Vue program, and `astro check`.
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version: '22'
                  cache: true

            - name: Format, lint and type-check
              run: vp check

            - name: Type-check SFCs and Astro
              if: ${{ !cancelled() }}
              run: vp run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version: '22'
                  cache: true

            - name: Install Playwright Browsers
              run: vp exec playwright install --with-deps chromium

            - name: Run Tests
              run: vp test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version: '22'
                  cache: true

            - name: Build
              run: vp run build

            - name: Smoke Test Packed Tarballs
              run: ./scripts/smoke-pack.sh

    # The one check branch protection requires: it passes only when every job above passed, so
    # adding, splitting or renaming those jobs never touches the repository settings.
    ci:
        if: ${{ always() }}
        needs: [check, test, build]
        runs-on: ubuntu-latest
        steps:
            - name: Require every job to succeed
              run: |
                  results="${{ join(needs.*.result, ' ') }}"
                  echo "check, test, build: $results"
                  for result in $results; do
                      [ "$result" = success ] || exit 1
                  done
