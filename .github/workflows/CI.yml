name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: ['**']
    push:
        branches: [next]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-pr:
        name: Validate PR Title
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    tests:
        name: Run Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - name: Install Playwright Browsers
              run: vp exec playwright install --with-deps chromium

            - name: Run Tests
              run: vp test

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - name: Run Typecheck
              run: vp run typecheck

    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            # Lint rules plus the TS 7 type check; formatting is its own job below.
            - name: Run Lint
              run: vp check --no-fmt

    build:
        name: Build Package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - name: Run Build
              run: vp run build

            - name: Smoke Test Packed Tarballs
              run: ./scripts/smoke-pack.sh
    format:
        name: Check Formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - name: Check Code Formatting
              run: vp fmt --check
