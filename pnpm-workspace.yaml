packages:
    - packages/**/*
    - '!packages/**/dist'

catalog:
    '@faker-js/faker': ^10.6.0
    '@types/node': ^24.13.6
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-react': ^6.1.1
    '@vitejs/plugin-vue': ^6.0.9
    '@vitest/browser-playwright': 5.0.3
    '@vitest/coverage-v8': 5.0.3
    '@vitest/ui': 5.0.3
    csstype: ^3.1.3
    playwright: ^1.63.0
    react: ^19.3.0
    react-dom: ^19.3.0
    typescript: 6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vitest: 5.0.3
    vitest-browser-react: ^2.3.0
    vitest-browser-vue: ^3.1.0
    vue: ^3.5.43
    vue-tsc: 3.3.11
    vite-plus: 1.1.0
overrides:
    vite@*: 'catalog:'
    vitest@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
